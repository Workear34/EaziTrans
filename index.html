<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaziTrans 翻译</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">EaziTrans 翻译</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar"
                aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">
                            <i class="bi bi-translate"></i> 翻译
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="settings.html">
                            <i class="bi bi-gear"></i> 设置
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="mt-4">
            <div class="card shadow">
                <!-- 顶部语言选择 -->
                <div class="card-header">
                    <div class="row align-items-center g-2">
                        <div class="col">
                            <select class="form-select" id="sourceLang">
                                <option value="auto">自动检测</option>
                                <option value="zh-hans">简体中文</option>
                                <option value="zh-hant">繁体中文</option>
                                <option value="en">英语</option>
                                <option value="ja">日语</option>
                                <option value="ko">韩语</option>
                                <option value="fr">法语</option>
                                <option value="de">德语</option>
                                <option value="pt">葡萄牙语</option>
                                <option value="es">西班牙语</option>
                                <option value="ru">俄语</option>
                                <option value="ar">阿拉伯语</option>
                                <option value="hi">印地语</option>
                                <option value="it">意大利语</option>
                                <option value="nl">荷兰语</option>
                                <option value="th">泰语</option>
                                <option value="tr">土耳其语</option>
                                <option value="vi">越南语</option>
                                <option value="id">印尼语</option>
                            </select>
                        </div>

                        <div class="col-auto">
                            <button class="btn btn-primary" id="swapBtn" title="交换语言">
                                <i class="bi bi-arrow-left-right"></i>
                            </button>
                        </div>

                        <div class="col">
                            <select class="form-select" id="targetLang">
                                <option value="zh-hans">简体中文</option>
                                <option value="zh-hant">繁体中文</option>
                                <option value="en">英语</option>
                                <option value="ja">日语</option>
                                <option value="ko">韩语</option>
                                <option value="fr">法语</option>
                                <option value="de">德语</option>
                                <option value="pt">葡萄牙语</option>
                                <option value="es">西班牙语</option>
                                <option value="ru">俄语</option>
                                <option value="ar">阿拉伯语</option>
                                <option value="hi">印地语</option>
                                <option value="it">意大利语</option>
                                <option value="nl">荷兰语</option>
                                <option value="th">泰语</option>
                                <option value="tr">土耳其语</option>
                                <option value="vi">越南语</option>
                                <option value="id">印尼语</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 文本区域 -->
                <div class="card-body position-relative">
                    <div class="row g-2 align-items-stretch">
                        <!-- 原文 -->
                        <div class="col-md-6 d-flex flex-column translation-pane">
                            <textarea class="form-control translation-area" id="sourceText" rows="12"
                                placeholder="请输入要翻译的文本"></textarea>
                            <div class="d-flex justify-content-between">
                                <div class="text-body-secondary align-self-center">
                                    共 <span id="textCount">0</span> 个字符
                                </div>
                                <button class="btn btn-primary align-self-end" id="translateBtn">
                                    <i class="bi bi-translate"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 译文 -->
                        <div class="col-md-6 d-flex flex-column text-divider">
                            <textarea class="form-control translation-area" id="targetText" rows="12"
                                placeholder="翻译结果将显示在这里" readonly=""></textarea>
                            <button class="btn btn-outline-secondary align-self-end" id="copyBtn">
                                <i class="bi bi-copy"></i>
                            </button>
                        </div>
                    </div>
                    <div id="loadingOverlay" class="loading position-absolute top-0 start-0 w-100 h-100 d-none">
                        <div class="position-absolute top-50 start-50 translate-middle">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 预留-->
    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
        <div id="toast" class="toast align-items-center text-bg-primary border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Close"></button>
            </div>
        </div>
    </div>


    <script type="module" src="src/main.js"></script>
</body>

</html>
